name: CI

on:
  push:
    branches: [ main, master, ashish, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master, ashish ]

jobs:
  lint-and-vet:
    name: Lint, Format & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l cmd/ internal/ scripts/ test/ proto/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Verify Go Modules Dependency Integrity
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  unit-and-integration-tests:
    name: Test Suite (${{ matrix.os }})
    needs: lint-and-vet
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Run Unit & Subsystem Tests (internal + proto)
        shell: bash
        run: go test -v -timeout 5m ./internal/... ./proto/...

      - name: Run CLI Command Tests (sequential to avoid SQLite contention)
        shell: bash
        run: go test -v -p 1 -timeout 8m ./cmd/...

      - name: Run Integration Tests
        shell: bash
        run: go test -v -p 1 -timeout 10m ./test/integration/...

  benchmarks:
    name: Scale & Performance Benchmarks
    needs: lint-and-vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Scheduler & Reconciler Benchmarks
        run: |
          go test -v -bench=. -benchmem -run=^$ ./internal/scheduler/...
          go test -v -bench=. -benchmem -run=^$ ./internal/controlplane/...

  cross-platform-build:
    name: Cross-Platform Build Matrix
    needs: [unit-and-integration-tests, benchmarks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Cross-Platform Build Harness
        run: go run ./scripts/cross_build/main.go
